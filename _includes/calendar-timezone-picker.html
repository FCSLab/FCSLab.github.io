{%- comment -%}
  FullCalendar + timezone picker.

  The consuming page must define a JS array of FullCalendar event objects
  (each with start/end/title, optionally url/backgroundColor/borderColor/
  extendedProps.subtitle) in a variable whose name matches `events_var`,
  in a <script> block that runs before this include.

  Parameters (all optional):
    events_var              JS variable name holding the events array.
                            Default: "calendarEvents".
    calendar_id             id of the calendar container div. Default: "calendar".
    selector_id             id of the timezone <select>. Default: "timezone-selector".
    display_id              id of the current-timezone display span.
                            Default: "current-timezone-display".
    default_timezone        IANA name selected on load. Default: "UTC".
    default_timezone_label  Visible label for the default timezone option.
                            Default: prettified form of default_timezone.
    initial_view            FullCalendar initial view name. Default: "timeGridFourDay".
    duration_days           Days shown in the grid. Default: derived from the
                            events, so the view spans exactly the conference and
                            no empty days appear.
    max_days                Safety cap on the derived span, in case a stray
                            event has a wrong year. Default: 10.
    timezones_json          URL of a JSON array of IANA timezone names.
                            Default: "/assets/timezones.json".
    fullcalendar_src        URL of the FullCalendar global bundle.
                            Default: jsDelivr CDN at 6.1.17. Override (for
                            example, with a site-relative vendored path)
                            when CDN reliability is a concern.
{%- endcomment -%}

{%- assign events_var = include.events_var | default: "calendarEvents" -%}
{%- assign calendar_id = include.calendar_id | default: "calendar" -%}
{%- assign selector_id = include.selector_id | default: "timezone-selector" -%}
{%- assign display_id = include.display_id | default: "current-timezone-display" -%}
{%- assign default_timezone = include.default_timezone | default: "UTC" -%}
{%- assign default_timezone_label = include.default_timezone_label | default: default_timezone -%}
{%- assign initial_view = include.initial_view | default: "timeGridFourDay" -%}
{%- assign duration_days = include.duration_days -%}
{%- assign max_days = include.max_days | default: 10 -%}
{%- assign timezones_json = include.timezones_json | default: "/assets/timezones.json" -%}
{%- comment -%}
  Calendar dependencies are vendored under assets/imports/. Override
  `fullcalendar_src` to point somewhere else if you need a different build.
{%- endcomment -%}
{%- capture vendored_fullcalendar -%}{% link assets/imports/fullcalendar/index.global.min.js %}{%- endcapture -%}
{%- assign fullcalendar_src = include.fullcalendar_src | default: vendored_fullcalendar -%}

<script src="{% link assets/imports/moment/moment.min.js %}"></script>
<script src="{% link assets/imports/moment/moment-timezone-with-data.min.js %}"></script>
<script src="{{ fullcalendar_src }}"></script>
<script src="{% link assets/imports/fullcalendar/moment-timezone.global.min.js %}"></script>

<div class="calendar-timezone-picker">
  Timezone:
  <select id="{{ selector_id }}">
    <option value="local">local</option>
    <option value="UTC">UTC</option>
    <option value="{{ default_timezone }}" selected>{{ default_timezone_label }}</option>
  </select>
  <span id="{{ display_id }}" class="calendar-timezone-current"></span>
</div>

<div id="{{ calendar_id }}"></div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var events = (typeof {{ events_var }} !== 'undefined') ? {{ events_var }} : [];

    // Work out the conference span from the events themselves, so the calendar
    // opens on the conference — not on whatever today happens to be — and shows
    // exactly the days that have activity. Dates are compared as YYYY-MM-DD
    // strings taken off the front of each ISO timestamp, which sidesteps any
    // timezone conversion: an event's day is the day its own timestamp names.
    var MAX_DAYS = {{ max_days }};

    function dayOf(iso) {
      var s = String(iso || '');
      return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : null;
    }

    function shiftDay(day, delta) {
      var d = new Date(day + 'T12:00:00');
      d.setDate(d.getDate() + delta);
      return d.toISOString().slice(0, 10);
    }

    function daysBetween(from, to) {
      return Math.round(
        (new Date(to + 'T12:00:00') - new Date(from + 'T12:00:00')) / 86400000
      );
    }

    var days = [];
    events.forEach(function (ev) {
      var startDay = dayOf(ev.start);
      if (!startDay) return;
      days.push(startDay);

      // A recurring entry runs to endRecur; a plain one to end. An end at
      // exactly midnight closes the previous day rather than opening a new one.
      var finish = ev.endRecur || ev.end;
      var endDay = dayOf(finish);
      if (endDay && endDay !== startDay) {
        if (/T00:00(:00)?/.test(String(finish))) endDay = shiftDay(endDay, -1);
        if (endDay >= startDay) days.push(endDay);
      }
    });
    days.sort();

    var firstDay = days.length ? days[0] : null;
    var lastDay = days.length ? days[days.length - 1] : null;

    var span = firstDay ? daysBetween(firstDay, lastDay) + 1 : 0;
    var capped = span > MAX_DAYS;
    if (capped) {
      console.warn(
        'Calendar: events span ' + span + ' days (' + firstDay + ' to ' + lastDay +
        '), which exceeds max_days=' + MAX_DAYS + '. Showing the first ' +
        MAX_DAYS + ' days — check for an event with a wrong date.'
      );
      span = MAX_DAYS;
    }

    {%- if duration_days %}
    span = {{ duration_days }};
    {%- endif %}

    var calendarEl = document.getElementById({{ calendar_id | jsonify }});
    var calendar = new FullCalendar.Calendar(calendarEl, {
      themeSystem: 'bootstrap5',
      initialView: {{ initial_view | jsonify }},
      views: {
        timeGridFourDay: {
          type: 'timeGrid',
          duration: { days: span || 4 }
        }
      },
      events: events,
      // Open on the first day of the conference.
      initialDate: firstDay || undefined,
      // Fence navigation to the conference. `end` is exclusive, so this is the
      // day after the last one with activity. With the view already covering
      // the whole span there is nowhere left to page to, and the header's
      // navigation buttons are dropped below.
      validRange: firstDay && !capped
        ? { start: firstDay, end: shiftDay(lastDay, 1) }
        : undefined,
      // Only offer paging when the span had to be capped; otherwise the whole
      // conference is already on screen and `today` would be meaningless.
      headerToolbar: capped
        ? { left: 'title', center: '', right: 'prev,next' }
        : { left: 'title', center: '', right: '' },
      slotEventOverlap: false,
      // Drawn only when today falls inside the visible range, so this is
      // inert outside the conference and a useful marker during it.
      nowIndicator: true,
      timeZone: {{ default_timezone | jsonify }},
      eventContent: function (arg) {
        var title = arg.event.title;
        var subtitle = arg.event.extendedProps && arg.event.extendedProps.subtitle;
        return {
          html:
            '<div class="fc-event-title">' + title +
            (subtitle
              ? '<div class="fc-event-subtitle" style="font-size: 0.85em; color: #fff;">' + subtitle + '</div>'
              : '') +
            '</div>'
        };
      }
    });
    calendar.render();

    var selector = document.getElementById({{ selector_id | jsonify }});
    var display = document.getElementById({{ display_id | jsonify }});

    function prettify(tz) {
      return tz.replace(/\//g, ' / ').replace(/_/g, ' ');
    }

    function updateTimezone(tz) {
      calendar.setOption('timeZone', tz);
      calendar.render();
      if (!display) return;
      var label = 'Calendar Timezone: ';
      if (tz === 'local') {
        label += 'Local Time';
      } else if (tz === 'UTC') {
        label += 'UTC';
      } else {
        label += prettify(tz);
      }
      try {
        var now = new Date();
        var timeString = now.toLocaleTimeString('en-US', {
          timeZone: tz === 'local' ? undefined : tz,
          hour12: false,
          hour: '2-digit',
          minute: '2-digit'
        });
        label += ' (' + timeString + ')';
      } catch (err) {
        console.warn('Invalid timezone for time display:', tz);
      }
      display.textContent = label;
    }

    async function populateTimezones() {
      try {
        var response = await fetch({{ timezones_json | relative_url | jsonify }});
        var timezones = await response.json();
        // Preserve the first three options (local, UTC, default) and append the rest.
        timezones.forEach(function (tz) {
          var option = document.createElement('option');
          option.value = tz;
          option.textContent = prettify(tz);
          selector.appendChild(option);
        });
      } catch (err) {
        console.error('Failed to load timezones:', err);
      }
    }

    selector.addEventListener('change', function () {
      updateTimezone(this.value);
    });

    populateTimezones();
    updateTimezone({{ default_timezone | jsonify }});
  });
</script>
