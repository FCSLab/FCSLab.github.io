<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- favicons -->
<link rel="icon" href="{{ site.favicon | relative_url }}">
<link rel="mask-icon" href="{{ site.favicon | relative_url }}" color="#000000">
<meta name="theme-color" content="#ffffff">

<!--
  Styles. Dependencies are vendored under assets/imports/ rather than loaded
  from a CDN: a conference site needs to still render years after the event,
  long after any given CDN has reorganised its URLs. See README for the
  versions in use and how to update them.
-->
<link rel="stylesheet" href="{% link assets/imports/fontawesome/css/all.min.css %}">
<link rel="stylesheet" href="{% link assets/imports/academicons/css/academicons.min.css %}">
<link rel="stylesheet" href="{% link assets/imports/bootstrap/bootstrap.min.css %}">
<link rel="stylesheet" type="text/css" href='{{ "/assets/styles.css" | relative_url }}'>

<!-- resolve theme before paint to avoid a flash of the wrong mode -->
<script>
  (function () {
    try {
      var choice = localStorage.getItem('theme');
      var resolved;
      if (choice === 'light' || choice === 'dark') {
        resolved = choice;
      } else {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        resolved = prefersDark ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-bs-theme', resolved);
    } catch (e) {
      document.documentElement.setAttribute('data-bs-theme', 'light');
    }
  })();
</script>

<!-- scripts -->
<script type="module" src="{% link assets/imports/lite-youtube/lite-youtube.min.js %}"></script>
