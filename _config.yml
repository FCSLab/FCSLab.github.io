# This is a demo config file showing a minimal set of default keys and keys used by the theme.
title: Your awesome title
email: your-email@example.com
tagline: Write a short description of the site here. # a short description
description: >- # this means to ignore newlines until "baseurl:"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: jekyllrb
github_username:  jekyll
footer_copyright: Name of Copyright Holder
logo: /assets/logo.svg
favicon: /assets/logo.svg

plugins:
  - jekyll-datapage-generator
  - jekyll-seo-tag
  - jekyll-redirect-from # lets a moved page keep its old URL via `redirect_from:`

# Top-level nav. Add a `children:` list to any entry to turn it into a
# dropdown; `url:` on the parent is then optional (omit it for a menu label
# that isn't itself a page).
navigation_header:
- title: Home
  url: /
- title: Call
  url: /call/
- title: Program
  children:
  - title: Calendar View
    url: /program/
  - title: By Session
    url: /program-by-session/
  - title: By Track
    url: /program-by-track/
- title: Committee
  url: /committee/
- title: Visit
  children:
  - title: Location
    url: /location/
  - title: Accessibility FAQ
    url: /accessibility/
- title: Contact
  url: /contact/

# Data files holding schedule entries. The first is the main schedule; add more
# for parallel programmes that run alongside it (installations, exhibits,
# always-on events). Pages read these via `{% include all-sessions.html %}`.
# Each one also needs its own `page_gen` block below to get session pages.
session_sources:
- data: sessions
  title: Sessions
- data: installations
  title: Installations

# this is the setup for the page_gen plugin which generates individual pages for data files in the _data directory.
page_gen:
- data: proceedings
  template: proceeding_entry
  dir: proceedings
  index_files: false
  name: id
  title: title
  extension: html
  page_data_prefix: entry
  debug: false
- data: sessions
  template: session_entry
  dir: sessions
  index_files: false
  name: id
  title: title
  extension: html
  page_data_prefix: entry
  debug: false
# Additional session sources share the `sessions` output dir and layout, so
# `datapage_url: "sessions"` resolves links to them the same way.
- data: installations
  template: session_entry
  dir: sessions
  index_files: false
  name: id
  title: title
  extension: html
  page_data_prefix: entry
  debug: false
