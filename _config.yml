# This is a demo config file showing a minimal set of default keys and keys used by the theme.
title: Freshwater and Climate Solutions Lab
email: Kimberly.Yazzie@ubc.ca
tagline: Research lab exploring freshwater ecology and climate adaptation. # a short description
description: The FCS Lab explores freshwater ecology and climate adaptation 
  and mitigation through an interdisciplinary lens.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://fcslab.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: 
github_username:  FCSLab
footer_copyright: Kimberly Yazzie
logo: #/assets/logo.svg
favicon: #/assets/logo.svg

plugins:
  - jekyll-datapage-generator
  - jekyll-seo-tag
  - jekyll-redirect-from # lets a moved page keep its old URL via `redirect_from:`

# ---------------------------------------------------------------------------
# Colour scheme
# ---------------------------------------------------------------------------
# Four base colours drive every colour on the site. Link colours, callout
# boxes, table rules, calendar events and the whole dark scheme are derived
# from these in assets/styles.scss, so changing these four values restyles
# everything — including Bootstrap's own components.
#
# Defaults are Wada Sanzo, "A Dictionary of Color Combinations", plate 243.
#
# Derived values are checked against WCAG AA (4.5:1 for text, 3:1 for borders
# and large text) in both light and dark mode. If you change these, re-check —
# `ink` in particular carries body text in light mode and the page background
# in dark mode, so it needs to stay dark.
colours:
  primary:   "#b85e00" # burnt orange — links, primary actions, keynote events
  highlight: "#ebd999" # pale sand — dark-mode text, warning surfaces
  secondary: "#58771e" # olive — info boxes, paper sessions
  ink:       "#1b3644" # deep teal — body text (light), page background (dark)

# Colour per session `type:` on the calendar. Values are palette-derived and
# verified to carry a white event label at AA. Add an entry for any new type.
session_colours:
  admin:         "#18303c"
  keynote:       "#a55908"
  papers:        "#516f23"
  artworks:      "#844400"
  workshops:     "#365333"
  installations: "#5b6e78"
  discussion:    "#465f18"
  break:         "#6a7464"

# Top-level nav. Add a `children:` list to any entry to turn it into a
# dropdown; `url:` on the parent is then optional (omit it for a menu label
# that isn't itself a page).
navigation_header:
- title: Home
  url: /
- title: Team
  url: /team/
- title: Contact
  url: /contact/

# Data files holding schedule entries. The first is the main schedule; add more
# for parallel programmes that run alongside it (installations, exhibits,
# always-on events). Pages read these via `{% include all-sessions.html %}`.
# Each one also needs its own `page_gen` block below to get session pages.
session_sources:
- data: sessions
  title: Sessions
- data: installations
  title: Installations

# this is the setup for the page_gen plugin which generates individual pages for data files in the _data directory.
page_gen:
- data: proceedings
  template: proceeding_entry
  dir: proceedings
  index_files: false
  name: id
  title: title
  extension: html
  page_data_prefix: entry
  debug: false
- data: sessions
  template: session_entry
  dir: sessions
  index_files: false
  name: id
  title: title
  extension: html
  page_data_prefix: entry
  debug: false
# Additional session sources share the `sessions` output dir and layout, so
# `datapage_url: "sessions"` resolves links to them the same way.
- data: installations
  template: session_entry
  dir: sessions
  index_files: false
  name: id
  title: title
  extension: html
  page_data_prefix: entry
  debug: false
